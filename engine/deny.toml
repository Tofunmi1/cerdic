# Licence and supply-chain policy. The GPL exclusion was removed; add a GPL SPDX id to `allow` only when a dependency needs it.
[graph]
targets = [{ triple = "wasm32-unknown-unknown" }, { triple = "aarch64-apple-darwin" }]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
         "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "CC0-1.0", "0BSD", "BSL-1.0"]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
ignore = true  # our own unpublished crates carry no SPDX licence yet (owner decision pending)

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true  # path deps on vendored crates and workspace members

[sources]
unknown-registry = "deny"
unknown-git = "deny"
