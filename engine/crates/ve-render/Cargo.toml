[package]
name = "ve-render"
version = "0.0.0"
description = "Render core on the vendored Bevy render crates: schedule, driver, extraction, pipelines."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bevy_app = { path = "../../third_party/bevy/crates/bevy_app" }
bevy_ecs = { path = "../../third_party/bevy/crates/bevy_ecs" }
bevy_asset = { path = "../../third_party/bevy/crates/bevy_asset" }
bevy_mesh = { path = "../../third_party/bevy/crates/bevy_mesh" }
bevy_camera = { path = "../../third_party/bevy/crates/bevy_camera" }
bevy_transform = { path = "../../third_party/bevy/crates/bevy_transform" }
bevy_render = { path = "../../third_party/bevy/crates/bevy_render", default-features = false }

# The browser backend: wgpu's WebGL2 (GLES) path. Native builds use the platform backends.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy_render = { path = "../../third_party/bevy/crates/bevy_render", default-features = false, features = ["webgl"] }

[lints]
workspace = true
