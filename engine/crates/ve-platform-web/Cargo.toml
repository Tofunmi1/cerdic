[package]
name = "ve-platform-web"
version = "0.0.0"
description = "Browser platform layer: canvas window, requestAnimationFrame runner, pointer input. wasm32 only."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Everything here is browser-only; on native targets the crate is empty.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy_app = { path = "../../third_party/bevy/crates/bevy_app" }
bevy_ecs = { path = "../../third_party/bevy/crates/bevy_ecs" }
bevy_input = { path = "../../third_party/bevy/crates/bevy_input" }
bevy_math = { path = "../../third_party/bevy/crates/bevy_math" }
bevy_window = { path = "../../third_party/bevy/crates/bevy_window" }
raw-window-handle.workspace = true
thiserror.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
  "Window", "Document", "Element", "HtmlCanvasElement", "EventTarget", "Event",
  "MouseEvent", "PointerEvent", "WheelEvent", "DomRect",
] }

[lints]
workspace = true
