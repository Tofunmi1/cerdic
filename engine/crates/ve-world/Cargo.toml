[package]
name = "ve-world"
version = "0.0.0"
description = "Pure-arithmetic world generation: tile-aware terrain, erosion, scatter, flora, LOD, rivers and rocks."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true

[dev-dependencies]
# Validates the WGSL the SimL code generator writes (the same front end the renderer's shaders go through).
naga = { version = "30", default-features = false, features = ["wgsl-in"] }

[lints]
workspace = true
