[package]
name = "ve-evaluator"
version = "0.0.0"
description = "Renderer-free browser worker entry over the shared modeling source."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ve-game = { path = "../ve-game" }
ve-measure = { path = "../ve-measure" }
ve-graph = { path = "../ve-graph" }
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
ve-modeling = { path = "../ve-modeling" }
wasm-bindgen.workspace = true

[lints]
workspace = true
