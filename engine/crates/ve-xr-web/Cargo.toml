[package]
name = "ve-xr-web"
version = "0.0.0"
description = "WebXR layer: session lifecycle, per-frame head and controller data, and the Bevy plugin that applies it."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bevy_app = { path = "../../third_party/bevy/crates/bevy_app" }
bevy_ecs = { path = "../../third_party/bevy/crates/bevy_ecs" }
bevy_math = { path = "../../third_party/bevy/crates/bevy_math" }
thiserror.workspace = true
ve-render = { path = "../ve-render" }
ve-xr-math = { path = "../ve-xr-math" }

# Browser glue; the pure frame logic above builds and is tested natively.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy_camera = { path = "../../third_party/bevy/crates/bevy_camera" }
bevy_render = { path = "../../third_party/bevy/crates/bevy_render", default-features = false, features = ["webgl"] }
js-sys.workspace = true
wgpu = { version = "30", default-features = false, features = ["webgl"] }
ve-platform-web = { path = "../ve-platform-web" }
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
web-sys = { workspace = true, features = ["HtmlCanvasElement", "WebGlFramebuffer"] }

[lints]
workspace = true
