[package]
name = "ve-runtime"
version = "0.0.0"
description = "The runtime entry point the web page calls: assembles the plugins into a Bevy app. wasm32 only."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Browser-only; on native targets the crate is empty.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy_app = { path = "../../third_party/bevy/crates/bevy_app" }
bevy_asset = { path = "../../third_party/bevy/crates/bevy_asset" }
bevy_camera = { path = "../../third_party/bevy/crates/bevy_camera" }
bevy_color = { path = "../../third_party/bevy/crates/bevy_color" }
bevy_diagnostic = { path = "../../third_party/bevy/crates/bevy_diagnostic" }
# `debug` keeps system and resource names in panic messages; revisit for size in M12.
bevy_ecs = { path = "../../third_party/bevy/crates/bevy_ecs", features = ["debug"] }
bevy_image = { path = "../../third_party/bevy/crates/bevy_image" }
bevy_input = { path = "../../third_party/bevy/crates/bevy_input" }
bevy_mesh = { path = "../../third_party/bevy/crates/bevy_mesh" }
bevy_time = { path = "../../third_party/bevy/crates/bevy_time" }
bevy_transform = { path = "../../third_party/bevy/crates/bevy_transform" }
bevy_window = { path = "../../third_party/bevy/crates/bevy_window" }
bevy_render = { path = "../../third_party/bevy/crates/bevy_render", default-features = false, features = ["webgl"] }
bevy_math = { path = "../../third_party/bevy/crates/bevy_math" }
ve-kernel = { path = "../ve-kernel" }
ve-platform-web = { path = "../ve-platform-web" }
ve-render = { path = "../ve-render" }
serde_json.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["console"] }

[lints]
workspace = true
