# Vendored Bevy 0.20.0 (see VENDOR.md). Own workspace: our gates do not lint or format this code.
[workspace]
resolver = "3"
members = [
  "crates/bevy_android",
  "crates/bevy_app",
  "crates/bevy_asset",
  "crates/bevy_asset/macros",
  "crates/bevy_camera",
  "crates/bevy_color",
  "crates/bevy_curve",
  "crates/bevy_derive",
  "crates/bevy_diagnostic",
  "crates/bevy_ecs",
  "crates/bevy_ecs/macro_logic",
  "crates/bevy_ecs/macros",
  "crates/bevy_encase_derive",
  "crates/bevy_extract",
  "crates/bevy_extract/macros",
  "crates/bevy_image",
  "crates/bevy_input",
  "crates/bevy_log",
  "crates/bevy_macro_utils",
  "crates/bevy_material",
  "crates/bevy_material/macros",
  "crates/bevy_math",
  "crates/bevy_mesh",
  "crates/bevy_platform",
  "crates/bevy_ptr",
  "crates/bevy_reflect",
  "crates/bevy_reflect/derive",
  "crates/bevy_render",
  "crates/bevy_render/macros",
  "crates/bevy_scene",
  "crates/bevy_scene/macros",
  "crates/bevy_shader",
  "crates/bevy_shape",
  "crates/bevy_tasks",
  "crates/bevy_time",
  "crates/bevy_transform",
  "crates/bevy_utils",
  "crates/bevy_window",
  # Added with the move to Bevy's own renderer (the effects crates and every crate their manifests name; see VENDOR.md).
  "crates/bevy_a11y",
  "crates/bevy_animation",
  "crates/bevy_animation/macros",
  "crates/bevy_anti_alias",
  "crates/bevy_audio",
  "crates/bevy_camera_controller",
  "crates/bevy_clipboard",
  "crates/bevy_core_pipeline",
  "crates/bevy_dev_tools",
  "crates/bevy_dylib",
  "crates/bevy_feathers",
  "crates/bevy_gilrs",
  "crates/bevy_gizmos",
  "crates/bevy_gizmos/macros",
  "crates/bevy_gizmos_render",
  "crates/bevy_gltf",
  "crates/bevy_input_focus",
  "crates/bevy_internal",
  "crates/bevy_light",
  "crates/bevy_pbr",
  "crates/bevy_picking",
  "crates/bevy_post_process",
  "crates/bevy_remote",
  "crates/bevy_settings",
  "crates/bevy_solari",
  "crates/bevy_sprite",
  "crates/bevy_sprite_render",
  "crates/bevy_state",
  "crates/bevy_state/macros",
  "crates/bevy_text",
  "crates/bevy_ui",
  "crates/bevy_ui_render",
  "crates/bevy_ui_widgets",
  "crates/bevy_winit",
  "crates/bevy_world_serialization",
]
exclude = [
  "crates/bevy_derive/compile_fail",
  "crates/bevy_ecs/compile_fail",
  "crates/bevy_reflect/compile_fail",
]

[workspace.lints.clippy]
doc_markdown = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
type_complexity = "allow"
undocumented_unsafe_blocks = "warn"
unwrap_or_default = "warn"
needless_lifetimes = "allow"
too_many_arguments = "allow"
nonstandard_macro_braces = "warn"
print_stdout = "warn"
print_stderr = "warn"

ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"

# see: https://github.com/bevyengine/bevy/pull/15375#issuecomment-2366966219
too_long_first_doc_paragraph = "allow"

# currently falsely fires on std::io, even tho core::io is unstable
# https://github.com/rust-lang/rust-clippy/issues/13158#issuecomment-4373196346
std_instead_of_core = "allow"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"

allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[workspace.lints.rust]
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs_dep)'] }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

# Unfortunately, cargo does not currently support overriding workspace lints
# inside a particular crate. See https://github.com/rust-lang/cargo/issues/13157
#
# We require an override for cases like `std_instead_of_core`, which are intended
# for the library contributors and not for how users should consume Bevy.
# To ensure examples aren't subject to these lints, below is a duplication of the
# workspace lints, with the "overrides" applied.
#
# [lints]
# workspace = true
