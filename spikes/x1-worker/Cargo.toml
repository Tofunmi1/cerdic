# X1 (throwaway): an evaluator-only wasm module (kernel + graph, no renderer) run inside a worker.
# Never imported by the engine; the answers go into the plan and ADR 0006.
[package]
name = "x1-eval"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ve-kernel = { path = "../../engine/crates/ve-kernel" }
ve-graph = { path = "../../engine/crates/ve-graph" }
wasm-bindgen = "=0.2.129"
serde_json = { version = "1", features = ["float_roundtrip"] }

[workspace]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = false
