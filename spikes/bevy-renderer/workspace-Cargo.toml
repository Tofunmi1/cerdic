# A scratch workspace over a sparse checkout of Bevy v0.20.0's crates (the original root manifest is Cargo.toml.orig). The spike
# crate answers one question: which of Bevy's renderer features run on WebGL2 and on WebGPU, in a browser, for us.
[workspace]
resolver = "3"
members = ["crates/*", "spike"]
exclude = ["crates/bevy_derive/compile_fail", "crates/bevy_ecs/compile_fail", "crates/bevy_reflect/compile_fail"]

# The Bevy crates take their lint settings from the workspace; the scratch copy needs none.
[workspace.lints.rust]
[workspace.lints.clippy]

[profile.dev]
opt-level = 1
debug = false

[profile.dev.package."*"]
opt-level = 1
debug = false
