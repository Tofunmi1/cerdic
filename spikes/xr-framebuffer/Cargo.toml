[package]
name = "xr_framebuffer"
version = "0.0.0"
edition = "2024"
publish = false

# Throwaway spike (M8a): can wgpu's WebGL backend render into a framebuffer created outside wgpu,
# the way a WebXR layer hands one out? Not part of the engine workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["webgl", "wgsl"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = ["HtmlCanvasElement", "WebGlFramebuffer", "WebGl2RenderingContext"] }

[patch.crates-io]
wgpu-hal = { path = "../../engine/third_party/wgpu-hal" }

[profile.release]
opt-level = "s"
panic = "abort"
