<!doctype html>
<meta charset="utf-8">
<title>xr-framebuffer spike</title>
<canvas id="c" width="64" height="64"></canvas>
<script type="module">
  import init, { Probe } from "./xr_framebuffer.js";
  const out = { done: false };
  window.__spike = out;
  try {
    await init();
    const canvas = document.getElementById("c");
    // wgpu acquires the canvas' WebGL2 context here.
    const probe = await Probe.create(canvas);
    // The same canvas hands back the same context, so objects made here are visible to wgpu.
    const gl = canvas.getContext("webgl2");
    const W = 32, H = 32;
    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    const framebuffer = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
    out.framebufferComplete = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
    // Paint it a known colour first so a "no-op" cannot pass for success.
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);

    probe.clear_external(framebuffer, W, H, 1.0, 0.0, 1.0);

    gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
    const pixel = new Uint8Array(4);
    gl.readPixels(W >> 1, H >> 1, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
    out.pixel = Array.from(pixel);
    out.glError = gl.getError();
  } catch (e) {
    out.error = String(e?.message ?? e);
  }
  out.done = true;
</script>
